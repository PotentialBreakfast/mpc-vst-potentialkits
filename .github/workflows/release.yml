# Builds PotentialKits from this repo's source and publishes it as a GitHub release.
# To release: bump the version in vst/vst.json (1.2.3 = 1203), add .github/release-notes/v<version>.md and push to main
# (or use the "New version" workflow). Every notes file that has no release yet is built -> tested (the engine and core
# tests and the kit's host test under ASan) -> built for armv7 and aarch64 -> zipped -> catalog-checked -> published.
name: Release

on:
  push:
    branches: [main]
    paths: ['.github/release-notes/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  KIT_REPO: https://github.com/open-mpc/mpc-vst-plugins
  KIT_REF: 52c1fb072966d7de77e97dd9eec0544548b042dc   # pinned: Open MPC kit for MPC OS 3.10.1 (plugin.json, Gen2 and SDK zips)
  ZIG_VERSION: 0.17.0
  SDK_REPO: https://github.com/inmusic-software/mpc-plugin-builder-sdk   # Akai's plugin SDK: converter + checker
  SDK_REF: febd2ca5bd9eb16c4a412837196e145566bc981b
  ABOUT: "Random drum-kit builder: 16 sounds from your own sample folders, KIT STYLES and ROLL, pitch, decay and choke, saved as an MPC drum program."

jobs:
  pending:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.p.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Find release notes without a release
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' || true)
          tags=()
          for f in .github/release-notes/v*.md; do
            [ -e "$f" ] || continue   # no notes yet
            t=$(basename "$f" .md)
            echo "$have" | grep -qx "$t" || tags+=("$t")
          done
          json=$(printf '%s\n' "${tags[@]}" | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "pending: $json"
          echo "tags=$json" >> "$GITHUB_OUTPUT"

  release:
    needs: pending
    if: needs.pending.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.pending.outputs.tags) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Work out the version from the tag
        id: t
        run: |
          TAG="${{ matrix.tag }}"
          { echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get the build kit (pinned) and tools
        run: |
          git clone -q "$KIT_REPO" kit && git -C kit checkout -q "$KIT_REF"
          git -C kit apply ../shared/mpc-vst-plugins-label-fit.patch
          pip install "ziglang==$ZIG_VERSION" pillow playwright
          python -m playwright install --with-deps chromium   # the skins are drawn by the kit's browser renderer ("art": "html")
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc

      - name: Check the version in vst.json matches the tag
        run: |
          python3 - <<PY
          import json
          v = json.load(open("vst/vst.json"))["version"]
          want = "${{ steps.t.outputs.version }}".split(".")
          expect = int(want[0]) * 1000 + int(want[1]) * 100 + int(want[2])
          assert v == expect, f"vst.json version {v} != tag {expect}"
          PY

      - name: Skin, params and tests (ASan)
        run: |
          mkdir -p vst/build
          gcc -O2 -I kit/tools/vendor/force-shadow/tools -o vst/build/shadow_art kit/tools/shadow_art.c -lm
          python3 shared/looks/build_looks.py vst kit   # the four looks, merged into one switchable skin
          bash kit/tools/test_port.sh vst/vst.json
          S="-fsanitize=address,undefined -g -O1 -w"
          cp kit/wrapper/engine.h vst/build/
          g++ $S -std=gnu++11 -I src tests/core_test.cpp -o vst/build/core_test && vst/build/core_test
          g++ $S -std=gnu++11 -pthread -I vst/build -I src tests/engine_test.cpp src/engine.cpp -o vst/build/engine_test && vst/build/engine_test
          # the LOOK switch, on a copy of the built plugin folder
          gcc $S -std=gnu11 -I src -I vst/build -I kit/wrapper -c shared/looks/test_theme.c -o vst/build/test_theme.o
          g++ $S -std=gnu++11 -pthread -I src -I vst/build -I kit/wrapper -c src/engine.cpp -o vst/build/engine_t.o
          g++ $S vst/build/test_theme.o vst/build/engine_t.o -lm -lpthread -o vst/build/test_theme
          cp -r "vst/build/skin/PotentialBreaks - VST - PotentialKits" "$RUNNER_TEMP/plugin"
          vst/build/test_theme "$RUNNER_TEMP/plugin"

      - name: Build for the MPC (Gen1 armv7 and Gen2 aarch64)
        run: |
          K=$GITHUB_WORKSPACE/kit
          Z="python3 -m ziglang"
          INC="-I src -I vst/build -I $K/wrapper"
          # glibc 2.29: older MPC and Force firmware. libc++ is linked in statically by zig.
          for t in "arm-linux-gnueabihf.2.29 -mcpu=cortex_a9 -mfpu=neon:armv7" "aarch64-linux-gnu.2.29 -mcpu=cortex_a55:aarch64"; do
            TG=${t%%:*}; A=${t##*:}; O=vst/build/$A; mkdir -p $O
            $Z c++ -target $TG -O2 -fPIC -fvisibility=hidden -std=gnu++11 $INC -c src/engine.cpp -o $O/engine.o
            $Z cc -target $TG -O2 -fPIC -fvisibility=hidden -std=gnu11 $INC -c $K/wrapper/vst2_wrap.c -o $O/vst2_wrap.o
            $Z c++ -target $TG -shared -fPIC $O/engine.o $O/vst2_wrap.o -lm -lpthread -Wl,--no-undefined -Wl,-s -o $O/potentialkits.so
          done
          cp vst/build/armv7/potentialkits.so vst/build/potentialkits.so
          sha256sum vst/build/armv7/potentialkits.so vst/build/aarch64/potentialkits.so

      - name: Package and check (per-CPU zips, Akai's folder format, the catalog's SDK zip)
        run: |
          K=$GITHUB_WORKSPACE/kit
          V=${{ steps.t.outputs.version }}
          git clone -q "$SDK_REPO" sdk && git -C sdk checkout -q "$SDK_REF"
          BENCH=; [ -f vst/bench.txt ] && BENCH="--bench vst/bench.txt"   # the CPU figure measured on a Gen1 MPC
          for arch in armv7 aarch64; do
            B=; [ $arch = armv7 ] && B="$BENCH"
            python3 $K/tools/release.py --so vst/build/$arch/potentialkits.so \
              --skin "vst/build/skin/PotentialBreaks - VST - PotentialKits" \
              --entry vst/build/pluginlist-entry.xml --version $V --id potentialkits --repo ${{ github.repository }} --license MIT \
              --user-data data --about "$ABOUT" $B -o $GITHUB_WORKSPACE/dist
            python3 $K/tools/catalog_check.py dist/PotentialKits-$V-mpc-$arch.zip --catalog
          done
          cp vst/build/aarch64/potentialkits.so vst/build/potentialkits-arm64.so
          python3 shared/akai/akai_pack.py --sdk sdk --zip dist/PotentialKits-$V-mpc-armv7.zip \
            --so64 vst/build/potentialkits-arm64.so --out dist --category "Drums"
          python3 $K/tools/sdk_zip.py dist/PotentialKits-$V-mpc-sdk.zip dist/PotentialKits-$V-mpc-armv7.zip dist/PotentialKits-$V-mpc-aarch64.zip
          cd dist && sha256sum *.zip | tee SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.t.outputs.tag }}
          NOTES=.github/release-notes/$TAG.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS --target "${{ github.sha }}" --title "PotentialKits ${{ steps.t.outputs.version }}" --notes-file "$NOTES"
          fi
