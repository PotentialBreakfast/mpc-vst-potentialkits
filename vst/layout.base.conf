# PotentialKits: the layout, edited by hand. shared/looks/make_looks.py turns it into the three looks (layout.conf, layout.rack.conf, layout.block.conf).
# 1.1.0: four pages instead of five. KIT (play and shape), STYLES (make a kit), SAVE (USER kits and export), SETUP.
# The POOL page is gone: TYPE on the KIT page picks what a pad draws from in one tap.
[tab KIT]
readout cx=330 cy=140 w=620 h=48 label="" key=status
button cx=835 cy=140 label="NEW KIT" key=generate w=320 h=68
button cx=1125 cy=140 label="ROLL" key=dice color=a86f1a w=240 h=68
frame x=14 y=190 w=760 h=514 title="PADS  ·  TAP ONE TO HEAR IT  ·  * = LOCKED"
list x=30 y=228 w=728 h=462 cols=4 rows=4 th=108 gap=10 key=tile mark=1 order=pads
frame x=784 y=190 w=482 h=514 title="SELECTED PAD"
readout cx=1025 cy=246 w=450 h=44 label="" key=sel_name
text cx=840 cy=314 label="TYPE" size=1.1 color=8b929c
stepper cx=1065 cy=314 w=380 h=52 label="" key=sel_type prev=sel_type_prev next=sel_type_next get=sel_type
button cx=905 cy=394 label="LOCK" label_on="LOCKED" key=sel_lock w=220 h=64
button cx=1145 cy=394 label="REROLL" key=sel_reroll w=220 h=64
knob cx=870 cy=508 r=44 label="GAIN" key=sel_gain
knob cx=1025 cy=508 r=44 label="PITCH" key=sel_pitch
knob cx=1180 cy=508 r=44 label="DECAY" key=sel_decay
text cx=840 cy=644 label="CHOKE" size=1.1 color=8b929c
enum_h cx=1080 cy=644 label="" key=sel_choke sw=72 sh=50 rows=1
qlinks "KIT" = sel_gain,sel_pitch,sel_decay,sel_choke
[tab STYLES]
frame x=14 y=100 w=840 h=604 title="KIT STYLES  ·  ONE TAP MAKES A KIT"
button cx=158 cy=226 label="CLASSIC" key=style_1 w=262 h=164
button cx=434 cy=226 label="BOOM BAP" key=style_2 w=262 h=164
button cx=710 cy=226 label="LO-FI" key=style_3 w=262 h=164
button cx=158 cy=410 label="TRAP" key=style_4 w=262 h=164
button cx=434 cy=410 label="HOUSE" key=style_5 w=262 h=164
button cx=710 cy=410 label="DUSTY JAZZ" key=style_6 w=262 h=164
button cx=158 cy=594 label="PERCUSSION" key=style_7 w=262 h=164
button cx=434 cy=594 label="ELECTRO" key=style_8 w=262 h=164
button cx=710 cy=594 label="WEIRD" key=style_9 w=262 h=164
frame x=864 y=100 w=402 h=604 title="ROLL  ·  LOCKED PADS STAY"
button cx=1065 cy=222 label="ROLL KIT" key=dice color=a86f1a w=350 h=136
enum_h cx=1065 cy=390 label="" key=wild sw=112 sh=110 rows=1
button cx=1065 cy=548 label="UNLOCK ALL" key=unlock_all w=350 h=76
button cx=1065 cy=642 label="CLEAR ALL" key=clear_all w=350 h=76
qlinks "STYLES" = wild
[tab SAVE]
readout cx=640 cy=136 w=1240 h=48 label="" key=status
frame x=14 y=176 w=760 h=528 title="USER KITS  ·  TAP SAVE, THEN A SLOT"
button cx=394 cy=266 label="SAVE" label_on="NOW TAP A SLOT" key=user_save color=a86f1a w=720 h=76
list x=30 y=320 w=728 h=370 cols=4 rows=2 th=176 gap=12 key=user mark=1
frame x=784 y=176 w=482 h=528 title="EXPORT AS A DRUM PROGRAM"
button cx=1025 cy=296 label="EXPORT KIT" key=export color=a86f1a w=440 h=120
button cx=1025 cy=428 label="MATCH LEVELS" key=normalise w=440 h=72
text cx=1025 cy=530 label="LAST EXPORT" size=1.1 color=8b929c
readout cx=1025 cy=578 w=450 h=44 label="" key=export_name
qlinks "SAVE" = -
[tab SETUP]
frame x=14 y=100 w=1252 h=300 title="LIBRARY"
text cx=110 cy=158 label="SAMPLES" size=1.1 color=8b929c
stepper cx=520 cy=158 w=560 h=46 label="" key=src_loc_name prev=src_loc_prev next=src_loc_next get=src_loc_name
stepper cx=1030 cy=158 w=420 h=46 label="" key=src_sub_name prev=src_sub_prev next=src_sub_next get=src_sub_name
text cx=110 cy=218 label="KITS GO TO" size=1.1 color=8b929c
stepper cx=520 cy=218 w=560 h=46 label="" key=exp_loc_name prev=exp_loc_prev next=exp_loc_next get=exp_loc_name
stepper cx=1030 cy=218 w=420 h=46 label="" key=exp_sub_name prev=exp_sub_prev next=exp_sub_next get=exp_sub_name
button cx=140 cy=290 label="RESCAN" key=rescan w=220 h=52
readout cx=410 cy=290 w=280 h=40 label="" key=lib_info
enum_h cx=930 cy=290 label="" key=export_mode sw=250 sh=48 rows=1
toggle cx=100 cy=362 label="SKIP LOOPS" key=skip_loops
toggle cx=275 cy=362 label="NO DUPLICATES" key=prevent_dup
toggle cx=470 cy=362 label="FOLLOW PLAYED PAD" key=follow
text cx=640 cy=362 label="MAX SIZE" size=1.1 color=8b929c
enum_h cx=990 cy=362 label="" key=max_size sw=84 sh=44 rows=1
qlinks "SETUP" = prevent_dup,skip_loops,max_size,export_mode
