# PotentialKits: the layout, edited by hand. shared/looks/make_looks.py turns it into the three looks (layout.conf, layout.rack.conf, layout.block.conf).
[tab KIT]
text cx=70 cy=140 label="STATUS" size=1.1 color=8b929c
readout cx=360 cy=140 w=440 h=44 label="" key=status
readout cx=745 cy=140 w=280 h=44 label="" key=lib_info
button cx=1120 cy=140 label="NEW KIT" key=generate color=a86f1a w=240 h=64
frame x=14 y=190 w=760 h=514 title="PADS  ·  TAP ONE TO HEAR IT"
list x=30 y=228 w=728 h=462 cols=4 rows=4 th=108 gap=10 key=tile mark=1 order=pads
frame x=784 y=190 w=482 h=514 title="SELECTED PAD"
