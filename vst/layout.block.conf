[tab MANUAL]
art file=skin/looks/_bg_block.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALKITS: A DRUM KIT FROM YOUR OWN SAMPLES" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:0
text cx=60 cy=280 label="Reaches into your sample folders and pulls out 16 sounds for the pads: a kick, a snare, hats and so on, plus a" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=312 label="few surprises. Lock what you like, roll the rest, then save it as a real MPC drum program." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=360 label="Load it as a plugin instrument (a plugin program). The first time, it scans your drives for samples." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=392 label="It looks in the Expansions and Samples folders on every drive. Pick another folder on the SETUP page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=424 label="Tap NEW KIT, a KIT STYLE on the DIP page, or ROLL." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=456 label="Play the pads, or tap a tile on the KIT page to hear it." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=240 label="THE KIT PAGE" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=280 label="The 16 tiles are laid out like the MPC's pads (A01 bottom left). A tile shows its sample; * means locked." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=312 label="Tap a tile to hear it and select it. With FOLLOW PLAYED PAD on (POOL page), playing a pad selects it too." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=344 label="LOCK keeps a pad's sample through NEW KIT, styles and ROLL. REROLL gives the pad a new one. CLEAR empties it." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=376 label="GAIN, PITCH (12 semitones each way) and DECAY (100 % is the whole sample) shape the pad." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=408 label="CHOKE: pads in the same group cut each other off, like closed and open hats. OFF plays freely." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=440 label="FAVOURITE makes a sample twice as likely to come up again. REJECT means it never comes up." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=60 cy=240 label="STYLES, ROLL AND USER KITS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=280 label="KIT STYLES set what each pad draws from, its pitch, decay and choke, then dip: CLASSIC, BOOM BAP, LO-FI," size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=312 label="TRAP, HOUSE, DUSTY JAZZ, PERCUSSION, ELECTRO and WEIRD. Locked pads are left alone." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=344 label="ROLL: MILD gives up to four pads a new sample. MEDIUM makes a new kit with a little pitch and decay. WILD" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=376 label="mixes up what the pads draw from too." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=408 label="USER KITS: tap SAVE, then a slot, to keep the whole kit. Tap a slot to bring it back, in any project." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=440 label="NEW KIT, CLEAR ALL, UNLOCK ALL, MATCH LEVELS (evens out loud and quiet pads) and EXPORT KIT." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=60 cy=240 label="SAVING THE KIT" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=280 label="EXPORT KIT writes a normal MPC drum program (.xpm) with your 16 samples on pads A01 to A16. Load it from the" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=312 label="browser like any kit." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=344 label="Pads with PITCH, DECAY or GAIN changed are saved as you hear them, as new WAV files. Other pads are copied as" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=376 label="they are." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=408 label="CHOKE becomes the program's mute groups." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=440 label="With LINK TO ORIGINALS (SETUP page) the samples are linked, not copied: PITCH is set on the pad instead, and" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=472 label="decay and gain are not saved." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=504 label="Kits go to PotentialKits/Kits on the plugin's drive, or the folder you pick on the SETUP page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=536 label="Your project remembers the kit, the locks and every setting. USER KITS live in PotentialSuite" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=568 label="Presets/PotentialKits." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=240 label="WHAT A PAD DRAWS FROM" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=280 label="The POOL page shows the selected pad's sounds. A lit key is a sound the pad can draw from." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=312 label="Tap keys to add or remove sounds: make pad 1 draw kicks and bass, say. Then REROLL it on the KIT page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=344 label="Sounds are sorted by their folder and file names: a folder called Kicks, or a file called punchy_kick_01.wav," size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=376 label="is a kick." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=408 label="Files in folders with no clear name end up in OTHER, which only a few pads draw from." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=280 label="Pads play MIDI notes 0 to 15 and 36 to 51, so the pads, a keyboard and the sequencer all work." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=312 label="SKIP LOOPS leaves out files that look like loops. MAX SIZE leaves out big files. Press RESCAN after changing" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=344 label="either." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=376 label="Very long files are cut to 15 seconds on the pad: PotentialKits is for one-shots." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=408 label="If you move or delete a sample, its tile shows ! before the name." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=440 label="Looks: Print Plate, Night Rack or Colour Block, on the SETUP page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=472 label="PotentialKits is a fork of Lucky Dip by sd88me. Thanks to him." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialkits" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
qlinks "MANUAL" = -
