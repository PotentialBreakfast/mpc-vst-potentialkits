[tab MANUAL]
art file=skin/looks/_bg_vintage.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALKITS: A DRUM KIT FROM YOUR OWN SAMPLES" size=1.9 weight=700 align=left color=2a2723 when=manual_page:0
text cx=60 cy=280 label="Reaches into your sample folders and pulls out 16 sounds for the pads: a kick, a snare, hats and so on, plus a" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=60 cy=312 label="few surprises. Lock what you like, roll the rest, then save it." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=360 label="Load it as a plugin instrument (a plugin program). The first time, it scans your drives for samples." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=392 label="It looks in the Expansions and Samples folders on every drive. Pick another folder on the SETUP page." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=424 label="Tap NEW KIT or ROLL on the KIT page, or a KIT STYLE on the STYLES page." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=456 label="Play the pads, or tap a tile on the KIT page to hear it." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=60 cy=240 label="THE KIT PAGE" size=1.9 weight=700 align=left color=2a2723 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=280 label="The 16 tiles are laid out like the MPC's pads (A01 bottom left). A tile shows its sample; * means locked." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=312 label="Tap a tile to hear it and select it. Playing a pad selects it too (FOLLOW PLAYED PAD, SETUP page)." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=344 label="TYPE: what the pad draws from. Tap the arrows: KICK, SNARE, CLAP ... BASS, SYNTH ... The pad gets a new sound" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=84 cy=376 label="of that type straight away. AUTO is the pad's usual sound." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=408 label="LOCK keeps a pad's sample through NEW KIT, styles and ROLL. REROLL gives the pad a new one." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=440 label="GAIN, PITCH (12 semitones each way) and DECAY (100 % is the whole sample) shape the pad." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=472 label="CHOKE: pads in the same group cut each other off, like closed and open hats. OFF plays freely." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=60 cy=240 label="STYLES AND ROLL" size=1.9 weight=700 align=left color=2a2723 when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:2
text cx=84 cy=280 label="KIT STYLES set what each pad draws from, its pitch, decay and choke, then pick a kit: CLASSIC, BOOM BAP," size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=84 cy=312 label="LO-FI, TRAP, HOUSE, DUSTY JAZZ, PERCUSSION, ELECTRO and WEIRD." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:2
text cx=84 cy=344 label="ROLL KIT (or ROLL on the KIT page): MILD gives up to four pads a new sample. MEDIUM makes a new kit with a" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=84 cy=376 label="little pitch and decay. WILD mixes up what the pads draw from too." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:2
text cx=84 cy=408 label="Locked pads are always left alone. UNLOCK ALL frees them; CLEAR ALL empties every unlocked pad." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=60 cy=240 label="SAVING THE KIT" size=1.9 weight=700 align=left color=2a2723 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=280 label="USER KITS: tap SAVE (it says NOW TAP A SLOT), then a slot. Tap a filled slot to bring the kit back, in any" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=84 cy=312 label="project. They live in PotentialSuite Presets/PotentialKits beside your VST2 Plugins folder." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=344 label="EXPORT KIT writes a normal MPC drum program (.xpm) with your 16 samples on pads A01 to A16. Load it from the" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=84 cy=376 label="browser like any kit." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=408 label="Pads with PITCH, DECAY or GAIN changed are saved as you hear them, as new WAV files. CHOKE becomes the" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=84 cy=440 label="program's mute groups." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=472 label="MATCH LEVELS evens out loud and quiet pads first." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=504 label="Kits go to PotentialKits/Kits on the plugin's drive, or the folder you pick on the SETUP page. With LINK TO" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=84 cy=536 label="ORIGINALS the samples are linked, not copied." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=2a2723 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=280 label="Pads play MIDI notes 0 to 15 and 36 to 51, so the pads, a keyboard and the sequencer all work." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=312 label="Sounds are sorted by their folder and file names: a folder called Kicks, or a file called punchy_kick_01.wav," size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=84 cy=344 label="is a kick." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=376 label="SKIP LOOPS leaves out files that look like loops. MAX SIZE leaves out big files. Press RESCAN after changing" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=84 cy=408 label="either." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=440 label="Very long files are cut to 15 seconds on the pad. If you move or delete a sample, its tile shows ! before the" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=84 cy=472 label="name." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=504 label="Looks: Print Plate, Night Rack, Colour Block or Vintage, on the SETUP page." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=536 label="PotentialKits is a fork of Lucky Dip by sd88me. Thanks to him." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=60 cy=584 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialkits" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
qlinks "MANUAL" = -
